<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; overflow-x: hidden; }
  #loading {
    position: fixed; inset: 0; background: #0d0a08;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; color: rgba(245,233,211,0.6);
    font-family: 'Cormorant Garamond', serif; font-style: italic;
  }
  #loading .spinner {
    width: 40px; height: 40px;
    border: 2px solid rgba(212,175,108,0.2); border-top-color: #d4af6c;
    border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading.hidden { display: none; }
  #error { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px; background: #0d0a08; color: rgba(245,233,211,0.7); }
  #error.show { display: flex; }
  #error .icon { font-size: 48px; margin-bottom: 16px; }
  #error .title { font-family: 'Cormorant Garamond', serif; font-size: 24px; color: white; margin-bottom: 8px; }
  #error .msg { font-size: 14px; line-height: 1.6; max-width: 320px; }
  #watermark { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(-30deg); font-size: 100px; font-weight: 900; color: rgba(255,0,0,0.12); pointer-events: none; z-index: 9000; letter-spacing: 12px; display: none; }
  #watermark.show { display: block; }
  #preview-banner { display: none; position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(90deg,rgba(255,80,80,0.95),rgba(255,120,80,0.95)); color: white; text-align: center; padding: 8px 16px; font-size: 12px; font-weight: 500; z-index: 8000; letter-spacing: 1px; }
  #preview-banner.show { display: block; }
  #invitation-root { display: none; }
  #invitation-root.show { display: block; }

<div id="loading"><div class="spinner"></div><div>Memuat undangan...</div></div>

<script>
  const BOT_API_URL = 'https://telegram-bot.daksara-dev.workers.dev';

  const THEME_KEY = 'sunset-bloom';

  let alreadyRendered = false;
  function safeRender(payload) {
    if (alreadyRendered) return;
    alreadyRendered = true;
    document.getElementById('loading').classList.add('hidden');
    renderInvitation(payload);
  }

  async function init() {
    // postMessage dari builder (iframe preview) — first-come-first-served
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'PREVIEW_DATA') {
        safeRender(event.data.payload);
      }
    });
    if (window.parent !== window) {
      window.parent.postMessage({ type: 'PREVIEW_READY' }, '*');
    }

    // Hash dari router atau builder preview — langsung render, tidak fetch ulang
    if (window.location.hash && window.location.hash.length > 5) {
      try {
        const payload = JSON.parse(decodeURIComponent(window.location.hash.slice(1)));
        safeRender(payload);
        return;
      } catch (e) {
        console.warn('Hash payload invalid, fallback ke fetch', e);
      }
    }

    // Fallback: ?id= langsung (tanpa router)
    const orderId = new URLSearchParams(window.location.search).get('id');
    if (!orderId) {
      // Tidak ada hash, tidak ada id → kemungkinan iframe preview yang nunggu postMessage
      return;
    }

    // Timeout 12 detik supaya tidak hang kalau worker down
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 12000);

    try {
      const response = await fetch(`${BOT_API_URL}/orders/data/${orderId}`, {
        signal: controller.signal,
        cache: 'default'
      });
      clearTimeout(timeoutId);

      if (!response.ok) {
        if (response.status === 404) {
          showError('Undangan tidak ditemukan', 'Pastikan link yang kamu buka benar.');
        } else if (response.status === 403) {
          showError('Akses ditolak', 'Pesanan ini ditolak oleh pemilik.');
        } else {
          showError('Server bermasalah', 'Coba refresh dalam beberapa saat.');
        }
        return;
      }

      const result = await response.json();
      if (!result.ok) {
        showError(
          result.error === 'Order not found' ? 'Undangan tidak ditemukan' : 'Akses ditolak',
          result.error || 'Tidak dapat memuat data.'
        );
        return;
      }
      safeRender(result);
    } catch (err) {
      clearTimeout(timeoutId);
      if (err.name === 'AbortError') {
        showError('Loading terlalu lama', 'Server lambat merespons. Coba refresh halaman.');
      } else {
        showError('Gagal memuat', 'Periksa koneksi internet kamu, atau hubungi owner.');
      }
    }
  }

  function showError(title, msg) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('errTitle').textContent = title;
    document.getElementById('errMsg').textContent = msg;
    document.getElementById('error').classList.add('show');
  }

  function renderInvitation({ theme, isPreview, data, watermark }) {
    document.getElementById('invitation-root').innerHTML = renderSunsetBloom(data);
    document.getElementById('invitation-root').classList.add('show');
    if (isPreview || watermark) {
      document.getElementById('watermark').classList.add('show');
      document.getElementById('preview-banner').classList.add('show');
      document.body.style.paddingTop = '34px';
    }
    document.getElementById('loading').classList.add('hidden');
    setTimeout(() => {
      initInvitationScripts(data);
      if (!isPreview && !watermark) {
        const orderId = new URLSearchParams(window.location.search).get('id')
          || (typeof data === 'object' && data.orderId)
          || null;
        // orderId bisa dari hash payload
        const hashOid = (() => { try { return JSON.parse(decodeURIComponent(window.location.hash.slice(1))).orderId; } catch(e) { return null; } })();
        const finalId = orderId || hashOid;
        if (finalId) initRsvp(finalId, THEME_KEY);
      }
    }, 100);
  }

  function initInvitationScripts(data) {
    if (data.weddingDate) {
      const target = new Date(`${data.weddingDate}T${data.akadStart || '08:00'}:00+07:00`).getTime();
      const update = () => {
        const diff = target - Date.now();
        if (diff < 0) return;
        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);
        document.querySelectorAll('[data-cd="d"]').forEach(el => el.textContent = String(d).padStart(2,'0'));
        document.querySelectorAll('[data-cd="h"]').forEach(el => el.textContent = String(h).padStart(2,'0'));
        document.querySelectorAll('[data-cd="m"]').forEach(el => el.textContent = String(m).padStart(2,'0'));
        document.querySelectorAll('[data-cd="s"]').forEach(el => el.textContent = String(s).padStart(2,'0'));
      };
      setInterval(update, 1000); update();
    }
    const MUSIC_URL = 'https://www.bensound.com/bensound-music/bensound-romantic.mp3';
    const audio = new Audio(MUSIC_URL);
    audio.loop = true; audio.volume = 0.5;
    let musicPlaying = false;
    const musicBtn = document.createElement('button');
    musicBtn.innerHTML = '♪';
    musicBtn.style.cssText = 'position:fixed;bottom:24px;right:20px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(200,169,110,0.4);background:rgba(13,10,7,0.85);color:#c8a96e;font-size:16px;cursor:pointer;z-index:9999;display:none;align-items:center;justify-content:center;backdrop-filter:blur(8px);transition:all 0.2s;';
    musicBtn.addEventListener('click', () => {
      if (musicPlaying) { audio.pause(); musicBtn.innerHTML = '♩'; musicBtn.style.opacity = '0.5'; musicPlaying = false; }
      else { audio.play(); musicBtn.innerHTML = '♪'; musicBtn.style.opacity = '1'; musicPlaying = true; }
    });
    document.body.appendChild(musicBtn);
    const openBtn = document.querySelector('[data-action="open"]');
    if (openBtn) {
      openBtn.addEventListener('click', () => {
        document.body.classList.remove('locked');
        setTimeout(() => window.scrollTo({ top: window.innerHeight, behavior: 'smooth' }), 100);
        audio.play().then(() => { musicPlaying = true; musicBtn.style.display = 'flex'; }).catch(() => { musicBtn.style.display = 'flex'; });
      });
    }
    document.body.classList.add('locked');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('visible'); });
    }, { threshold: 0.15 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  }

    return `

      ${d.groomOrder ? `<div class="person-fullname">${esc(d.groomOrder.toUpperCase())}</div>` : ''}
      ${d.groomFather || d.groomMother ? `
        <div class="person-parents">
          ${esc(d.groomFather || '')}<br>
          ${d.groomFather && d.groomMother ? '&amp;<br>' : ''}
          ${esc(d.groomMother || '')}
        </div>
      ` : ''}
    </div>
  </section>
  
  ${d.weddingDate ? `
  <section class="countdown-section fade-in">
    <div class="section-tag">save the date</div>
    <h2 class="section-title">Counting Down</h2>
    
    <div class="countdown">
      <div class="countdown-item">
        <div class="countdown-num" data-cd="d">00</div>
        <div class="countdown-label">Hari</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" data-cd="h">00</div>
        <div class="countdown-label">Jam</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" data-cd="m">00</div>
        <div class="countdown-label">Menit</div>
      </div>
      <div class="countdown-item">
        <div class="countdown-num" data-cd="s">00</div>
        <div class="countdown-label">Detik</div>
      </div>
    </div>
  </section>
  ` : ''}
  
  <section class="fade-in">
    <div class="section-tag">when &amp; where</div>
    <h2 class="section-title">Wedding Day</h2>
    <p class="section-subtitle">Dengan penuh syukur, kami mengundang Anda</p>
    
    ${d.akadVenue ? `
    <div class="event-card">
      <div class="event-icon">۞</div>
      <div class="event-name">Akad Nikah</div>
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; color:#8b6450; font-size:14px;">${date.day}</div>
      <div class="event-date">${date.formatted}</div>
      <div class="event-time">${esc(d.akadStart)} — ${esc(d.akadEnd)} WIB</div>
      <div class="event-venue">${esc(d.akadVenue)}</div>
      <div class="event-address">${esc(d.akadAddress || '').replace(/\n/g, '<br>')}</div>
      ${d.akadMaps ? `<a href="${esc(d.akadMaps)}" target="_blank" class="map-btn">LIHAT LOKASI</a>` : ''}
    </div>
    ` : ''}
    
    ${d.resepsiVenue ? `
    <div class="event-card">
      <div class="event-icon">✿</div>
      <div class="event-name">Resepsi</div>
      <div style="font-family:'Cormorant Garamond',serif; font-style:italic; color:#8b6450; font-size:14px;">${date.day}</div>
      <div class="event-date">${date.formatted}</div>
      <div class="event-time">${esc(d.resepsiStart)} — ${esc(d.resepsiEnd)} WIB</div>
      <div class="event-venue">${esc(d.resepsiVenue)}</div>
      <div class="event-address">${esc(d.resepsiAddress || '').replace(/\n/g, '<br>')}</div>
      ${d.resepsiMaps ? `<a href="${esc(d.resepsiMaps)}" target="_blank" class="map-btn">LIHAT LOKASI</a>` : ''}
    </div>
    ` : ''}
  </section>
  
  ${d.bank1Num || d.bank2Num ? `
  <section class="gift-section fade-in">
    <div class="section-tag">with love</div>
    <h2 class="section-title">Wedding Gift</h2>
    <p class="section-subtitle">Doa restu adalah hadiah terindah</p>
    
    ${d.bank1Num ? `
    <div class="bank-card">
      <div class="bank-name">${esc(d.bank1Name)}</div>
      <div class="bank-number">${formatBank(d.bank1Num)}</div>
      <div class="bank-holder">a.n. ${esc(d.bank1Holder || '')}</div>
      <button class="copy-btn" onclick="copyText('${d.bank1Num}', this)">SALIN NOMOR</button>
    </div>
    ` : ''}
    
    ${d.bank2Num ? `
    <div class="bank-card">
      <div class="bank-name">${esc(d.bank2Name)}</div>
      <div class="bank-number">${formatBank(d.bank2Num)}</div>
      <div class="bank-holder">a.n. ${esc(d.bank2Holder || '')}</div>
      <button class="copy-btn" onclick="copyText('${d.bank2Num}', this)">SALIN NOMOR</button>
    </div>
    ` : ''}
  </section>
  ` : ''}
  
  <footer class="footer">
    <div style="color:#ec8772; font-size:16px; letter-spacing:8px; margin-bottom:24px; opacity:0.6;">✿  ✿  ✿</div>
    <h2 class="footer-thanks">Terima Kasih</h2>
    <p class="footer-message">
      Merupakan suatu kehormatan dan kebahagiaan apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.
    </p>
    <div class="footer-couple">${esc(brideShort)} &amp; ${esc(groomShort)}</div>
    <div style="font-family:'Caveat',cursive; font-size:18px; color:#8b6450; margin-top:6px;">— beserta keluarga —</div>
  </footer>
</div>

<script>
  document.body.classList.add('theme-bloom');
  function copyText(t, btn) {
    navigator.clipboard?.writeText(t);
    const o = btn.textContent;
    btn.textContent = '✓ TERSALIN';
    setTimeout(() => btn.textContent = o, 1200);
  }
<\/script>
    `;
  }
  
  // ============ RSVP ============
  function initRsvp(orderId, theme) {
    const isBloom  = theme === 'sunset-bloom';
    const isJawa   = theme === 'adat-jawa';
    const isRoyal  = !isBloom && !isJawa;

    const accent    = isBloom ? '#e8825a' : '#c4a464';
    const accentBg  = isBloom ? '#fff0ea' : 'rgba(196,164,100,0.08)';
    const border    = isBloom ? '#f0d9cc' : 'rgba(196,164,100,0.25)';
    const bg        = isBloom ? '#fff8f5' : (isJawa ? '#2a1a08' : '#15100a');
    const textColor = isBloom ? '#7b4f3a' : '#f0e0c0';
    const subColor  = isBloom ? '#a0776a' : 'rgba(240,224,192,0.55)';
    const fontTitle = isBloom ? "'DM Serif Display', serif" : "'Cormorant Garamond', serif";
    const radius    = isBloom ? '8px' : '0px';

    const root = document.getElementById('invitation-root');
    const rsvpEl = document.createElement('div');
    rsvpEl.id = 'rsvp-wrap';
    rsvpEl.style.cssText = `max-width:480px; margin:0 auto; padding:60px 24px 80px; background:${bg}; font-family:'Cormorant Garamond',serif;`;
    rsvpEl.innerHTML = `
      <div style="text-align:center; margin-bottom:28px;">
        <div style="font-family:${fontTitle}; font-size:28px; color:${textColor}; letter-spacing:2px;">RSVP &amp; Ucapan</div>
        <div style="font-size:14px; color:${subColor}; font-style:italic; margin-top:6px;">Sampaikan kehadiran &amp; doa terbaikmu</div>
      </div>

      <div id="rsvp-form">
        <input id="rsvp-name" type="text" placeholder="Nama kamu" maxlength="60" style="
          width:100%; box-sizing:border-box; padding:12px 16px;
          background:${isRoyal ? 'rgba(255,255,255,0.05)' : '#fff'};
          border:1px solid ${border}; color:${textColor};
          font-family:'Cormorant Garamond',serif; font-size:16px;
          margin-bottom:12px; outline:none; border-radius:${radius};
        "/>

        <div style="display:flex; gap:10px; margin-bottom:12px;">
          <div id="btn-hadir" onclick="rsvpSelect(true)" style="
            flex:1; text-align:center; padding:11px;
            border:1px solid ${border}; cursor:pointer; font-size:14px;
            color:${subColor}; transition:all .2s; border-radius:${radius};
          ">✅ Hadir</div>
          <div id="btn-tidak" onclick="rsvpSelect(false)" style="
            flex:1; text-align:center; padding:11px;
            border:1px solid ${border}; cursor:pointer; font-size:14px;
            color:${subColor}; transition:all .2s; border-radius:${radius};
          ">❌ Tidak Hadir</div>
        </div>

        <textarea id="rsvp-msg" placeholder="Ucapan &amp; doa (opsional)" maxlength="200" rows="3" style="
          width:100%; box-sizing:border-box; padding:12px 16px;
          background:${isRoyal ? 'rgba(255,255,255,0.05)' : '#fff'};
          border:1px solid ${border}; color:${textColor};
          font-family:'Cormorant Garamond',serif; font-size:15px;
          margin-bottom:14px; resize:none; outline:none; border-radius:${radius};
        "></textarea>

        <button onclick="rsvpSubmit('${orderId}')" style="
          width:100%; padding:13px;
          background:${isRoyal ? 'linear-gradient(135deg,#d4af6c,#b8951f)' : 'linear-gradient(135deg,#e8825a,#d4604a)'};
          color:${isRoyal ? '#0d0a08' : '#fff'};
          border:none; font-family:${isRoyal ? "'Cinzel',serif" : "'Inter',sans-serif"};
          font-size:${isRoyal ? '12px' : '15px'};
          ${isRoyal ? 'letter-spacing:3px;' : 'font-weight:600;'}
          cursor:pointer; border-radius:${radius};
        ">KIRIM RSVP 💌</button>
        <div id="rsvp-err" style="color:#c0392b; font-size:13px; text-align:center; margin-top:8px; display:none;"></div>
      </div>

      <div id="rsvp-ok" style="display:none; text-align:center; padding:28px 0;">
        <div style="font-size:40px; margin-bottom:10px;">🎉</div>
        <div style="font-family:${fontTitle}; font-size:22px; color:${textColor};">Terima kasih, <span id="rsvp-ok-name"></span>!</div>
        <div style="font-style:italic; font-size:14px; color:${subColor}; margin-top:6px;">RSVP kamu sudah kami terima.</div>
      </div>

      <div id="ucapan-list" style="margin-top:32px;"></div>
    `;
    root.appendChild(rsvpEl);
  }

  let _rsvpAttending = null;

  window.rsvpSelect = function(val) {
    _rsvpAttending = val;
    const isBloom  = document.body.classList.contains('theme-bloom');
    const accent   = isBloom ? '#e8825a' : '#c4a464';
    const accentBg = isBloom ? '#fff0ea' : 'rgba(196,164,100,0.1)';
    document.getElementById('btn-hadir').style.borderColor  = val  ? accent   : '';
    document.getElementById('btn-hadir').style.background   = val  ? accentBg : '';
    document.getElementById('btn-tidak').style.borderColor  = !val ? accent   : '';
    document.getElementById('btn-tidak').style.background   = !val ? accentBg : '';
  };

  window.rsvpSubmit = async function(orderId) {
    const name    = document.getElementById('rsvp-name').value.trim();
    const message = document.getElementById('rsvp-msg').value.trim();
    const errEl   = document.getElementById('rsvp-err');

    if (!name) {
      errEl.textContent = 'Nama tidak boleh kosong.';
      errEl.style.display = 'block';
      return;
    }
    if (_rsvpAttending === null) {
      errEl.textContent = 'Pilih kehadiran dulu.';
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    try {
      const res = await fetch(`${BOT_API_URL}/orders/rsvp/${orderId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, attending: _rsvpAttending, message })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Gagal kirim');

      document.getElementById('rsvp-form').style.display = 'none';
      document.getElementById('rsvp-ok-name').textContent = name;
      document.getElementById('rsvp-ok').style.display = 'block';

      if (message) appendUcapan(name, _rsvpAttending, message);
    } catch(e) {
      errEl.textContent = e.message;
      errEl.style.display = 'block';
    }
  };

  function appendUcapan(name, attending, message) {
    const isBloom  = document.body.classList.contains('theme-bloom');
    const isJawa   = document.body.classList.contains('theme-jawa');
    const border   = isBloom ? '#f0d9cc' : 'rgba(196,164,100,0.2)';
    const bg       = isBloom ? '#fff' : (isJawa ? 'rgba(255,255,255,0.02)' : 'rgba(255,255,255,0.03)');
    const nameColor = isBloom ? '#7b4f3a' : '#c4a464';
    const msgColor  = isBloom ? '#6b5045' : 'rgba(240,224,192,0.65)';
    const radius    = isBloom ? '10px' : '0px';

    const list = document.getElementById('ucapan-list');
    const item = document.createElement('div');
    item.style.cssText = `background:${bg}; border:1px solid ${border}; padding:14px 16px; margin-bottom:10px; border-radius:${radius};`;
    item.innerHTML = `
      <div style="font-weight:600; color:${nameColor}; font-size:14px;">${esc(name)} <span style="font-weight:400; opacity:0.5;">${attending ? '✅' : '❌'}</span></div>
      <div style="color:${msgColor}; font-size:14px; margin-top:5px; font-style:italic;">"${esc(message)}"</div>
    `;
    list.prepend(item);
  }

  // ============ HELPERS ============
  function esc(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  
  function formatDate(dateStr) {
    if (!dateStr) return { formatted: '— · — · —', day: '' };
    const d = new Date(dateStr);
    const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    const months = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    return {
      formatted: `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`,
      day: days[d.getDay()],
      iso: dateStr,
    };
  }
  
  function formatBank(num) {
    if (!num) return '';
    return String(num).replace(/(.{4})/g, '$1 ').trim();
  }
  
  // Start
  init();
</script>
</body>
</html>
