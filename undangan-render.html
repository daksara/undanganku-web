<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Undangan Pernikahan</title>
<meta property="og:image" content="https://undanganku-web.vercel.app/og-image.png">
<meta name="theme-color" content="#0d0a07">
<style>
  body { margin:0; background:#0d0a08; display:flex; align-items:center; justify-content:center; height:100vh; flex-direction:column; gap:12px; }
  .sp { width:36px;height:36px;border:2px solid rgba(212,175,108,0.2);border-top-color:#d4af6c;border-radius:50%;animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { font-family:serif;font-style:italic;font-size:13px;letter-spacing:2px;color:rgba(245,233,211,0.4); }
  #err { display:none;color:rgba(245,233,211,0.6);font-family:serif;text-align:center;padding:32px; }
</style>
</head>
<body>
<div class="sp"></div>
<p>Memuat undangan...</p>
<div id="err"></div>
<script>
  const BOT_API_URL = 'https://telegram-bot.daksara-dev.workers.dev';
  const THEME_PAGES = {
    'royal-classic':     './tema-royal.html',
    'sunset-bloom':      './tema-bloom.html',
    'adat-jawa':         './tema-jawa.html',
    'modern-minimalist': './tema-royal.html',
  };

  async function route() {
    // Preview via hash — langsung forward ke tema
    if (window.location.hash) {
      try {
        const d = JSON.parse(decodeURIComponent(window.location.hash.slice(1)));
        const page = THEME_PAGES[d.theme] || './tema-royal.html';
        window.location.replace(page + window.location.hash);
        return;
      } catch(e) {}
    }

    const id = new URLSearchParams(window.location.search).get('id');
    if (!id) {
      showErr('Link tidak valid.');
      return;
    }

    try {
      const res = await fetch(`${BOT_API_URL}/orders/data/${id}`);
      const r = await res.json();
      if (!r.ok) {
        showErr(r.error || 'Undangan tidak ditemukan.');
        return;
      }
      // Pass seluruh data via hash — tema file tidak perlu fetch ulang
      const theme = r.data?.theme || 'royal-classic';
      const page = THEME_PAGES[theme] || './tema-royal.html';
      const payload = encodeURIComponent(JSON.stringify({
        theme: theme,
        paket: r.data?.paket || '',
        isPreview: r.watermark || false,
        watermark: r.watermark || false,
        data: r.data,
        orderId: id,
      }));
      window.location.replace(page + '#' + payload);
    } catch(e) {
      showErr('Gagal memuat. Periksa koneksi internet.');
    }
  }

  function showErr(msg) {
    document.querySelector('.sp').style.display = 'none';
    document.querySelector('p').style.display = 'none';
    const el = document.getElementById('err');
    el.style.display = 'block';
    el.textContent = msg;
  }

  route();
</script>
</body>
</html>
