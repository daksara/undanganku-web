<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>UndanganKu — Chat Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #0f0d0a;
  --bg-card: #1a1612;
  --bg-input: #221d18;
  --bg-bot: #1e1a15;
  --bg-user: #2a3d2a;
  --accent: #d4af6c;
  --accent-bright: #e8c585;
  --text: #f0e6d2;
  --text-dim: rgba(240, 230, 210, 0.6);
  --text-mute: rgba(240, 230, 210, 0.35);
  --line: rgba(212, 175, 108, 0.15);
  --success: #6ec789;
  --danger: #e87a7a;
  --user-text: #d4f0c8;
}

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  height: 100%;
  overflow: hidden;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
}

/* ===== HEADER ===== */
.header {
  background: rgba(15,13,10,0.95);
  backdrop-filter: blur(20px);
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
  z-index: 10;
}

.header-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #8b6914);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
  position: relative;
}
.header-avatar::after {
  content: '';
  position: absolute;
  bottom: 1px;
  right: 1px;
  width: 10px;
  height: 10px;
  background: var(--success);
  border-radius: 50%;
  border: 2px solid var(--bg);
}

.header-info { flex: 1; }
.header-name {
  font-family: 'DM Serif Display', serif;
  font-style: italic;
  font-size: 16px;
  color: var(--accent-bright);
  line-height: 1.2;
}
.header-status {
  font-size: 11px;
  color: var(--success);
  display: flex;
  align-items: center;
  gap: 4px;
}
.header-status::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--success);
  display: inline-block;
}

.progress-bar {
  height: 2px;
  background: rgba(212,175,108,0.1);
  flex-shrink: 0;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-bright));
  transition: width 0.6s ease;
  width: 0%;
}

/* ===== CHAT AREA ===== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px 8px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  scroll-behavior: smooth;
}

.chat-area::-webkit-scrollbar { width: 3px; }
.chat-area::-webkit-scrollbar-track { background: transparent; }
.chat-area::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

/* Date chip */
.date-chip {
  text-align: center;
  margin: 8px 0;
}
.date-chip span {
  font-size: 10px;
  color: var(--text-mute);
  background: rgba(255,255,255,0.04);
  padding: 3px 12px;
  border-radius: 100px;
  letter-spacing: 0.5px;
}

/* ===== BUBBLE ===== */
.msg-row {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  animation: bubbleIn 0.3s ease forwards;
  opacity: 0;
  transform: translateY(8px);
}
@keyframes bubbleIn {
  to { opacity: 1; transform: translateY(0); }
}

.msg-row.bot { justify-content: flex-start; }
.msg-row.user { justify-content: flex-end; }

.bot-ava {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #8b6914);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
  margin-bottom: 2px;
}

.bubble {
  max-width: 78%;
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 13.5px;
  line-height: 1.55;
  position: relative;
  word-break: break-word;
}

.bubble.bot {
  background: var(--bg-bot);
  border: 1px solid var(--line);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

.bubble.user {
  background: var(--bg-user);
  border: 1px solid rgba(110,199,137,0.2);
  border-bottom-right-radius: 4px;
  color: var(--user-text);
}

.bubble-time {
  font-size: 10px;
  color: var(--text-mute);
  margin-top: 4px;
  text-align: right;
}
.bubble.bot + .bubble-time { text-align: left; }

/* Typing indicator */
.typing-row { display: flex; align-items: flex-end; gap: 6px; }
.typing-bubble {
  background: var(--bg-bot);
  border: 1px solid var(--line);
  border-radius: 18px;
  border-bottom-left-radius: 4px;
  padding: 12px 16px;
  display: flex;
  gap: 4px;
  align-items: center;
}
.typing-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--text-mute);
  animation: typingPulse 1.2s infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingPulse {
  0%, 60%, 100% { opacity: 0.3; transform: scale(1); }
  30% { opacity: 1; transform: scale(1.2); }
}

/* ===== QUICK REPLIES ===== */
.quick-replies {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px 4px;
  flex-shrink: 0;
}

.qr-btn {
  background: rgba(212,175,108,0.08);
  border: 1px solid rgba(212,175,108,0.35);
  color: var(--accent);
  padding: 8px 16px;
  border-radius: 100px;
  font-size: 13px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}
.qr-btn:hover, .qr-btn:active {
  background: rgba(212,175,108,0.18);
  border-color: var(--accent);
  transform: scale(0.97);
}

/* Theme cards in chat */
.theme-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 12px 4px;
  flex-shrink: 0;
}

.theme-opt {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 0;
}
.theme-opt:hover { border-color: var(--accent); }
.theme-opt:active { transform: scale(0.99); }

.theme-opt-thumb {
  width: 64px;
  height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.theme-opt-thumb.royal { background: linear-gradient(135deg, #1f1208, #3d2418); }
.theme-opt-thumb.bloom { background: linear-gradient(135deg, #fef5ed, #f4a574); }
.theme-opt-thumb.jawa { background: linear-gradient(135deg, #2c1f0e, #4a3520); }

.theme-opt-info {
  flex: 1;
  padding: 0 14px;
}
.theme-opt-name {
  font-family: 'DM Serif Display', serif;
  font-size: 15px;
  margin-bottom: 2px;
}
.theme-opt-tag {
  font-size: 11px;
  color: var(--text-mute);
}

.theme-opt-arrow {
  padding-right: 14px;
  color: var(--text-mute);
  font-size: 16px;
}

/* Paket cards in chat */
.paket-options {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 8px 12px 4px;
  flex-shrink: 0;
}

.paket-opt {
  background: var(--bg-card);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.paket-opt:hover { border-color: var(--accent); }
.paket-opt:active { transform: scale(0.99); }
.paket-opt.premium { border-color: rgba(212,175,108,0.4); background: rgba(212,175,108,0.05); }

.paket-opt-badge {
  position: absolute;
  top: 10px;
  right: 12px;
  background: linear-gradient(135deg, var(--accent), #c8870a);
  color: #0a0a0a;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 1px;
  padding: 2px 8px;
  border-radius: 100px;
}

.paket-opt-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.paket-opt-name {
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-dim);
}
.paket-opt-price {
  font-family: 'DM Serif Display', serif;
  font-size: 22px;
  color: var(--accent-bright);
  margin-bottom: 2px;
}
.paket-opt-sub {
  font-size: 10px;
  color: var(--text-mute);
  margin-bottom: 8px;
}
.paket-opt-features {
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.7;
}
.paket-opt-features .premium-feat { color: var(--accent); }

/* ===== INPUT AREA ===== */
.input-area {
  padding: 10px 12px 16px;
  background: rgba(15,13,10,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}

.input-wrap {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: 22px;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  transition: border-color 0.2s;
}
.input-wrap:focus-within { border-color: var(--accent); }

#chatInput {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13.5px;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
}
#chatInput::placeholder { color: var(--text-mute); }

.send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #b8951f);
  border: none;
  color: #0a0a0a;
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ===== SUMMARY CARD in chat ===== */
.summary-bubble {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 14px;
  font-size: 12.5px;
  margin-top: 6px;
}
.summary-bubble .row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.summary-bubble .row:last-child { border: none; }
.summary-bubble .row .lbl { color: var(--text-mute); }
.summary-bubble .row .val { color: var(--text); font-weight: 500; text-align: right; max-width: 60%; }
.summary-bubble .total-row .val {
  color: var(--accent-bright);
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
}

/* ===== BANK CARD in chat ===== */
.bank-bubble {
  background: rgba(212,175,108,0.06);
  border: 1px solid rgba(212,175,108,0.25);
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 6px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.bank-info-name { font-size: 11px; color: var(--text-mute); margin-bottom: 2px; }
.bank-info-num {
  font-family: 'DM Serif Display', serif;
  font-size: 18px;
  color: var(--accent-bright);
}
.copy-btn {
  background: rgba(212,175,108,0.1);
  border: 1px solid var(--line);
  color: var(--accent);
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 10px;
  cursor: pointer;
  letter-spacing: 0.8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
}

/* Status card */
.status-bubble {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  margin-top: 6px;
  text-align: center;
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 16px;
  border-radius: 100px;
  font-size: 12px;
  font-weight: 500;
  background: rgba(255,200,0,0.1);
  color: #fbbf24;
  border: 1px solid rgba(255,200,0,0.3);
  margin-bottom: 10px;
}
.status-pill.paid {
  background: rgba(110,199,137,0.12);
  color: var(--success);
  border-color: rgba(110,199,137,0.4);
}
.status-pill.rejected {
  background: rgba(232,122,122,0.12);
  color: var(--danger);
  border-color: rgba(232,122,122,0.4);
}
.pulse {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}
.order-id-display {
  font-family: 'DM Serif Display', serif;
  font-size: 15px;
  color: var(--accent);
  margin-bottom: 8px;
}
.status-detail {
  font-size: 11.5px;
  color: var(--text-dim);
  line-height: 1.6;
}

/* Link aktif */
.link-aktif {
  word-break: break-all;
  color: var(--accent);
  font-size: 12px;
  margin-top: 6px;
  display: inline-block;
}
.copy-link-btn {
  margin-top: 10px;
  background: linear-gradient(135deg, var(--accent), #b8951f);
  color: #0a0a0a;
  border: none;
  padding: 10px 20px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Plus Jakarta Sans', sans-serif;
  letter-spacing: 0.5px;
  width: 100%;
}

/* Toast */
.toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%) translateY(-200%);
  background: var(--bg-card);
  border: 1px solid var(--line);
  padding: 10px 20px;
  border-radius: 100px;
  font-size: 13px;
  z-index: 200;
  transition: transform 0.3s;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--success); color: var(--success); }
.toast.error { border-color: var(--danger); color: var(--danger); }

/* Photo guide inside bubble */
.photo-guide {
  background: rgba(212,175,108,0.05);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-dim);
  line-height: 1.7;
}
.photo-guide .step-item {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  margin-bottom: 4px;
}
.photo-guide .step-num {
  background: rgba(212,175,108,0.15);
  color: var(--accent);
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 9px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* Scroll anchor */
#chatBottom { height: 1px; }
</style>
</head>
<body>

<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-avatar">💌</div>
    <div class="header-info">
      <div class="header-name">UndanganKu</div>
      <div class="header-status">Online — siap bantu</div>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <!-- CHAT AREA -->
  <div class="chat-area" id="chatArea">
    <div class="date-chip"><span>Hari ini</span></div>
    <div id="chatBottom"></div>
  </div>

  <!-- QUICK REPLIES / OPTIONS -->
  <div class="quick-replies" id="quickReplies" style="display:none;"></div>
  <div class="theme-options" id="themeOptions" style="display:none;"></div>
  <div class="paket-options" id="paketOptions" style="display:none;"></div>

  <!-- INPUT -->
  <div class="input-area" id="inputArea">
    <div class="input-wrap">
      <textarea id="chatInput" placeholder="Ketik pesan..." rows="1"
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="sendMsg()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ CONFIG ============
const BOT_API_URL = 'https://telegram-bot.daksara-dev.workers.dev';
const PRICES = { standard: 29000, premium: 49000 };
const THEME_FILE_MAP = {
  'royal-classic': 'tema-royal.html',
  'sunset-bloom': 'tema-bloom.html',

};
const TEMA_LABEL = {
  'royal-classic': 'Royal Classic',
  'sunset-bloom': 'Sunset Bloom',
  'adat-jawa': 'Adat Jawa',

// ============ STATE ============
let state = {

  brideMother: {

  },
  brideIG: {

    inputType: 'text',
    dataKey: 'brideIG',
    placeholder: '@andiniputri',
    optional: true,
  },
  groomName: {
    msgs: ['Sekarang data *mempelai pria* ya! 🤵\n\nNama lengkapnya siapa?'],
    inputType: 'text',
    dataKey: 'groomName',
    placeholder: 'Contoh: Reza Pratama Adiputra',
  },
  groomNick: {
    msgs: ['Nama panggilannya?'],
    inputType: 'text',
    dataKey: 'groomNick',
    placeholder: 'Contoh: Reza',
  },
  groomOrder: {
    msgs: ['Putra ke-berapa dari siapa?'],
    inputType: 'text',
    dataKey: 'groomOrder',
    placeholder: 'Contoh: Putra kedua dari Bapak Hendra',
  },
  groomFather: {
    msgs: ['Nama ayah mempelai pria?'],
    inputType: 'text',
    dataKey: 'groomFather',
    placeholder: 'Contoh: Bapak Drs. Hendra Adiputra',
  },
  groomMother: {
    msgs: ['Nama ibu mempelai pria?'],

// ============ UTILS ============
function getTime() {
  return new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function scrollToBottom() {
  setTimeout(() => {
    const area = document.getElementById('chatArea');
    area.scrollTop = area.scrollHeight;
  }, 50);
}

function setProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function formatRp(n) {
  return 'Rp ' + n.toLocaleString('id-ID');
}

function markdownToHtml(text) {
  return text
    .replace(/\*([^*]+)\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

// ============ CHAT RENDER ============
function addBotBubble(html, extraEl = null, delay = 0) {
  return new Promise(resolve => {
    // Show typing first
    const typingRow = document.createElement('div');
    typingRow.className = 'typing-row';
    typingRow.innerHTML = `
      <div class="bot-ava">💌</div>
      <div class="typing-bubble">
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      </div>`;
    const area = document.getElementById('chatArea');
    const bottom = document.getElementById('chatBottom');
    area.insertBefore(typingRow, bottom);
    scrollToBottom();

    const typingTime = 600 + delay;
    setTimeout(() => {
      typingRow.remove();

      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const bubble = document.createElement('div');
      bubble.className = 'bubble bot';
      bubble.innerHTML = markdownToHtml(html);

      const wrap = document.createElement('div');
      wrap.style.maxWidth = '82%';
      wrap.appendChild(bubble);
      if (extraEl) wrap.appendChild(extraEl);

      const timeEl = document.createElement('div');
      timeEl.className = 'bubble-time';
      timeEl.textContent = getTime();
      wrap.appendChild(timeEl);

      row.innerHTML = `<div class="bot-ava">💌</div>`;
      row.appendChild(wrap);
      area.insertBefore(row, bottom);
      scrollToBottom();
      resolve();
    }, typingTime);
  });
}

function addUserBubble(text) {
  const area = document.getElementById('chatArea');
  const bottom = document.getElementById('chatBottom');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div style="max-width:78%;">
      <div class="bubble user">${markdownToHtml(text)}</div>
      <div class="bubble-time">${getTime()} ✓✓</div>
    </div>`;
  area.insertBefore(row, bottom);
  scrollToBottom();
}

async function handleQR(option) {
  addUserBubble(option);
  hideQR();
  document.getElementById('inputArea').style.display = 'none';

  if (state.step === 'start') {
    if (option.includes('Mulai')) {
      await goStep('pickTheme');
    } else {
      await goStep('help');
    }
  } else if (state.step === 'help') {
    if (option.includes('Lanjut')) {
      await goStep('pickTheme');
    } else {
      await addBotBubble('Silakan hubungi owner via Instagram ya! 👉 @willyanugrh');
      showQR(['✨ Oke, mau lanjut pesan!']);
    }
  } else if (state.step === 'resepsiSame') {
    if (option.includes('sama')) {
      // Copy akad data to resepsi
      state.data.resepsiVenue = state.data.akadVenue;
      state.data.resepsiAddress = state.data.akadAddress;
      state.data.resepsiMaps = state.data.akadMaps || '';
      await addBotBubble('Oke, resepsi di tempat yang sama! 👍\n\nJam berapa resepsi mulai dan selesai?\nFormat: HH:MM - HH:MM');
      showInput('text', '11:00 - 15:00');
      document.getElementById('inputArea').style.display = 'flex';
      state.step = 'resepsiTimeOnly';
    } else {
      await goStep('resepsiTime');
    }
  } else if (state.step === 'preview') {
    if (option.includes('benar')) {
      await goStep('payment');
    } else {
      await addBotBubble('Oke! Data mana yang mau diedit? Ketik bagian yang mau diubah (misal: "nama mempelai wanita" atau "tanggal")');
      showInput('text', 'Ketik bagian yang ingin diedit...');
      document.getElementById('inputArea').style.display = 'flex';
      state.step = 'edit';
    }
  } else if (state.step === 'payment') {
    await submitOrder();
  }
}

async function handleTextInput(val) {
  const step = state.step;
  const stepDef = STEPS[step];

  if (step === 'edit') {
    await addBotBubble('Untuk edit data, silakan hubungi owner via WhatsApp ya setelah order masuk, atau mulai ulang dengan refresh halaman 😊');
    await goStep('preview');
    return;
  }

  if (step === 'resepsiTimeOnly') {
    state.data.resepsiTime = val;
    setProgress(60);
    await goStep('buyerContact');
    return;
  }

  if (stepDef && stepDef.dataKey) {
    state.data[stepDef.dataKey] = val;
  }

  // Handle gallery extra photos
  if (step === 'premiumGallery') {
    if (val && !val.toLowerCase().includes('skip') && !val.toLowerCase().includes('ga') && val.length > 5) {
      state.data.galleryPhoto1 = val;
      state.galleryCount = 1;
      await addBotBubble('Foto 1 tersimpan! 📸\n\nMau tambah foto 2? (Boleh skip)');
      showInput('text', 'https://drive.google.com/... atau ketik "skip"');
      document.getElementById('inputArea').style.display = 'flex';
      state.step = 'gallery2';
    } else {
      await goStep('preview');
    }
    return;
  }

  if (step === 'gallery2') {
    if (val && !val.toLowerCase().includes('skip') && val.length > 5) {
      state.data.galleryPhoto2 = val;
      await addBotBubble('Foto 2 tersimpan! 📸\n\nMau tambah foto 3? (Boleh skip)');
      showInput('text', 'https://drive.google.com/... atau ketik "skip"');
      document.getElementById('inputArea').style.display = 'flex';
      state.step = 'gallery3';
    } else {
      await goStep('preview');
    }
    return;
  }

  if (step === 'gallery3') {
    if (val && !val.toLowerCase().includes('skip') && val.length > 5) {
      state.data.galleryPhoto3 = val;
      await addBotBubble('Foto 3 tersimpan! 📸\n\nMau tambah foto 4? (Boleh skip)');
      showInput('text', 'https://drive.google.com/... atau ketik "skip"');
      document.getElementById('inputArea').style.display = 'flex';
      state.step = 'gallery4';
    } else {
      await goStep('preview');
    }
    return;
  }

  if (step === 'gallery4') {
    if (val && !val.toLowerCase().includes('skip') && val.length > 5) {
      state.data.galleryPhoto4 = val;
    }
    await goStep('preview');
    return;
  }

  // Advance to next step
  const nextStep = getNextStep(step);
  if (nextStep) {
    await goStep(nextStep);
  }
}

function getNextStep(currentStep) {
  const order = STEP_ORDER_STANDARD;
  const idx = order.indexOf(currentStep);
  if (idx >= 0 && idx < order.length - 1) {
    return order[idx + 1];
  }
  return null;
}

// ============ GO TO STEP ============
async function goStep(stepKey) {
  state.step = stepKey;
  const stepDef = STEPS[stepKey];
  if (!stepDef) return;

  // Update progress
  const progressMap = {
    start: 0, pickTheme: 5,
    brideName: 20, brideNick: 22, brideOrder: 24, brideFather: 26, brideMother: 28, brideIG: 30,
    groomName: 35, groomNick: 37, groomOrder: 39, groomFather: 41, groomMother: 43, groomIG: 45,
    weddingDate: 50, akadTime: 52, akadVenue: 54, akadAddress: 56, akadMaps: 58,
    resepsiSame: 60, resepsiTime: 62, resepsiVenue: 63, resepsiAddress: 64, resepsiMaps: 65,
    buyerContact: 68, buyerIG: 70,
    pickPaket: 72, premiumPhoto: 76, premiumGallery: 80,
    preview: 85, payment: 90, submitted: 100
  };
  if (progressMap[stepKey] !== undefined) setProgress(progressMap[stepKey]);

  // Special: preview
  if (stepKey === 'preview') {
    await showPreview();
    return;
  }

  // Special: payment
  if (stepKey === 'payment') {
    await showPayment();
    return;
  }

  // Regular steps
  if (stepDef.msgs) {
    for (let i = 0; i < stepDef.msgs.length; i++) {
      await addBotBubble(stepDef.msgs[i], null, i > 0 ? 300 : 0);
    }
  }

  // Show input
  if (stepDef.inputType === 'qr') {
    showQR(stepDef.qrOptions);
  } else if (stepDef.inputType === 'theme') {
    showThemes();
  } else if (stepDef.inputType === 'paket') {
    showPakets();
  } else if (stepDef.inputType === 'none') {
    showInput('none');
  } else {
    showInput(stepDef.inputType, stepDef.placeholder || '');
    document.getElementById('inputArea').style.display = 'flex';

    // Add skip button for optional
    if (stepDef.optional) {
      const qr = document.getElementById('quickReplies');
      qr.innerHTML = '';
      qr.style.display = 'flex';
      const skipBtn = document.createElement('button');
      skipBtn.className = 'qr-btn';
      skipBtn.textContent = 'Lewati (skip)';
      skipBtn.onclick = async () => {
        addUserBubble('Lewati');
        hideQR();
        document.getElementById('inputArea').style.display = 'none';
        // Set empty
        if (stepDef.dataKey) state.data[stepDef.dataKey] = '';
        const nextStep = getNextStep(stepKey);
        if (nextStep) await goStep(nextStep);
      };
      qr.appendChild(skipBtn);
    }

    setTimeout(() => document.getElementById('chatInput').focus(), 300);
  }
}

      <div>
        <div class="bank-info-name">BCA — a/n Willy Anugrah</div>
        <div class="bank-info-num">1234567890</div>
      </div>
      <button class="copy-btn" onclick="copyBank('1234567890')">SALIN</button>
    </div>
    <div class="bank-bubble" style="margin-top:6px;">
      <div>
        <div class="bank-info-name">GoPay / OVO / Dana</div>
        <div class="bank-info-num">0812-3456-7890</div>
      </div>
      <button class="copy-btn" onclick="copyBank('081234567890')">SALIN</button>
    </div>
  `;

  await addBotBubble(`*Step 5:* Hampir selesai! 🎉\n\nTransfer *${formatRp(price)}* ke salah satu rekening berikut:`, bankEl);
  await addBotBubble(`Setelah transfer, tap tombol di bawah ya! Owner akan konfirmasi dan link undangan langsung aktif. 🔔`, null, 500);
  showQR(['✅ Sudah transfer, kirim order!']);
}

// ============ SUBMIT ORDER ============
async function submitOrder() {
  hideQR();
  document.getElementById('inputArea').style.display = 'none';
  await addBotBubble('⏳ Mengirim pesanan...');

  const formData = buildFormData();

  try {
    const response = await fetch(`${BOT_API_URL}/orders/new`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        theme: state.selectedTheme,
        paket: state.selectedPaket,
        buyerContact: state.data.buyerContact || '',
        buyerInstagram: state.data.buyerInstagram || '',
        sumber: state.sumber,
        ...formData,
      }),
    });

    const result = await response.json();

    if (result.ok && result.orderId) {
      state.orderId = result.orderId;
      localStorage.setItem('undanganku_order', result.orderId);
      localStorage.setItem('undanganku_theme', state.selectedTheme);
      await showOrderStatus(result.orderId);
      startPolling(result.orderId);
    } else {
      await addBotBubble('❌ Gagal mengirim pesanan. Coba lagi ya!\n\n' + (result.error || ''));
      showQR(['🔄 Coba lagi']);
    }
  } catch (err) {
    await addBotBubble('❌ Tidak bisa terhubung ke server. Pastikan koneksi internet kamu aktif ya!');
    showQR(['🔄 Coba lagi']);
    console.error(err);
  }
}

async function showOrderStatus(orderId) {
  const statusEl = document.createElement('div');
  statusEl.className = 'status-bubble';
  statusEl.id = 'statusBubble';
  statusEl.innerHTML = `
    <div class="order-id-display">Order #${orderId}</div>
    <div class="status-pill" id="statusPill">
      <div class="pulse"></div>
      <span id="statusText">Menunggu konfirmasi owner...</span>
    </div>
    <div class="status-detail" id="statusDetail">
      Owner sudah mendapat notifikasi via Telegram. Halaman ini otomatis update saat pesanan dikonfirmasi. 🔔
    </div>
  `;

  await addBotBubble('🎉 *Pesanan berhasil dikirim!*\n\nOwner akan segera konfirmasi:', statusEl);
  setProgress(100);
  showInput('none');
}

function updateStatusUI(status, orderId) {
  const pill = document.getElementById('statusPill');
  const text = document.getElementById('statusText');
  const detail = document.getElementById('statusDetail');
  if (!pill) return;

  if (status === 'paid') {
    pill.className = 'status-pill paid';
    pill.innerHTML = `<span>✅</span> <span>Terkonfirmasi!</span>`;
    const liveUrl = `${BOT_API_URL}/u/${encodeURIComponent(orderId)}`;
    window._liveUrl = liveUrl;
    detail.innerHTML = `
      🎉 Pembayaran terkonfirmasi!<br><br>
      Link undangan kamu sudah aktif:<br>
      <a href="${liveUrl}" target="_blank" class="link-aktif">${liveUrl}</a><br>
      <button class="copy-link-btn" onclick="copyLiveUrl()">📋 Salin Link Undangan</button>
    `;
    showToast('🎉 Undangan aktif!', 'success');
  } else if (status === 'rejected') {
    pill.className = 'status-pill rejected';
    pill.innerHTML = `<span>❌</span> <span>Ditolak</span>`;
    detail.textContent = 'Pembayaran ditolak. Hubungi owner via Instagram @willyanugrh untuk klarifikasi.';
  }
}

function startPolling(orderId) {
  state.pollingInterval = setInterval(async () => {
    try {
      const r = await fetch(`${BOT_API_URL}/orders/status/${orderId}`);
      const result = await r.json();
      if (result.ok) {
        updateStatusUI(result.status, orderId);
        if (result.status === 'paid' || result.status === 'rejected') {
          clearInterval(state.pollingInterval);
          localStorage.removeItem('undanganku_order');
          localStorage.removeItem('undanganku_theme');
        }
      }
    } catch (e) { console.error('Polling:', e); }
  }, 5000);
}

// ============ BUILD FORM DATA ============
function buildFormData() {
  const d = state.data;
  // Parse akad time
  let akadStart = '08:00', akadEnd = '10:00';
  if (d.akadTime) {
    const parts = d.akadTime.split('-').map(s => s.trim());
    if (parts.length >= 1) akadStart = parts[0];
    if (parts.length >= 2) akadEnd = parts[1];
  }
  let resepsiStart = '11:00', resepsiEnd = '15:00';
  if (d.resepsiTime) {
    const parts = d.resepsiTime.split('-').map(s => s.trim());
    if (parts.length >= 1) resepsiStart = parts[0];
    if (parts.length >= 2) resepsiEnd = parts[1];
  }

  return {
    brideName: d.brideName || '',
    brideNick: d.brideNick || '',
    brideOrder: d.brideOrder || '',
    brideFather: d.brideFather || '',
    brideMother: d.brideMother || '',
    brideIG: d.brideIG || '',
    groomName: d.groomName || '',
    groomNick: d.groomNick || '',
    groomOrder: d.groomOrder || '',
    groomFather: d.groomFather || '',
    groomMother: d.groomMother || '',
    groomIG: d.groomIG || '',
    weddingDate: d.weddingDate || '',
    akadStart, akadEnd,
    akadVenue: d.akadVenue || '',
    akadAddress: d.akadAddress || '',
    akadMaps: d.akadMaps || '',
    resepsiStart, resepsiEnd,
    resepsiVenue: d.resepsiVenue || d.akadVenue || '',
    resepsiAddress: d.resepsiAddress || d.akadAddress || '',
    resepsiMaps: d.resepsiMaps || d.akadMaps || '',
    quoteArabic: d.quoteArabic || '',
    quoteText: d.quoteText || '',
    quoteSource: d.quoteSource || '',
    couplePhotoUrl: d.couplePhotoUrl || '',
    galleryPhoto1: d.galleryPhoto1 || '',
    galleryPhoto2: d.galleryPhoto2 || '',
    galleryPhoto3: d.galleryPhoto3 || '',
    galleryPhoto4: d.galleryPhoto4 || '',
  };
}

// ============ COPY UTILS ============
function copyBank(num) {
  navigator.clipboard?.writeText(num);
  showToast('Nomor tersalin! ✓', 'success');
}

function copyLiveUrl() {
  const url = window._liveUrl || '';
  navigator.clipboard?.writeText(url);
  showToast('Link tersalin! ✓', 'success');
}

// ============ CHECK EXISTING ORDER ============
function checkExistingOrder() {
  const urlParams = new URLSearchParams(window.location.search);
  const existingOrder = urlParams.get('order') || localStorage.getItem('undanganku_order');
  const savedTheme = localStorage.getItem('undanganku_theme');

  if (existingOrder) {
    state.orderId = existingOrder;
    if (savedTheme) state.selectedTheme = savedTheme;

    fetch(`${BOT_API_URL}/orders/status/${existingOrder}`)
      .then(r => r.json())
      .then(async result => {
        if (!result.ok) {
          localStorage.removeItem('undanganku_order');
          localStorage.removeItem('undanganku_theme');
          goStep('start');
          return;
        }
        await addBotBubble(`Haii! 👋 Pesanan kamu sebelumnya ditemukan!\n\nOrder *#${existingOrder}*`);
        await showOrderStatus(existingOrder);
        updateStatusUI(result.status, existingOrder);
        if (result.status === 'pending') startPolling(existingOrder);
        else {
          localStorage.removeItem('undanganku_order');
          localStorage.removeItem('undanganku_theme');
        }
      })
      .catch(() => { goStep('start'); });

    return true;
  }

  // Check URL params
  const paramSrc = urlParams.get('src');
  if (paramSrc === 'shopee' || paramSrc === 'tokped') {
    state.sumber = 'ecommerce';
  }

  return false;
}

// ============ INIT ============
(async function init() {
  const hasExisting = checkExistingOrder();
  if (!hasExisting) {
    setTimeout(() => goStep('start'), 400);
  }
})();
</script>
